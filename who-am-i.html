  <main class="page who">
    <h1><span>Who</span> <span>am</span> <span>I?</span></h1>
    <div class="body">
      <p class="intro">I am a multilingual, multidisciplinary word cloud fascinated by translation.</p>

      <svg class="diagram" viewBox="0 0 900 250" role="img"
           aria-label="A scattered cloud of dots, then the same dots with several tangled outlines drawn around them, then one clean outline.">
        <defs>
          <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation="4"/>
          </filter>
          <g id="cloud" filter="url(#soft)">
            <circle cx="-90" cy="-40" r="14" fill="#FFCC29"/>
            <circle cx="-58" cy="-72" r="13" fill="#6FD36F"/>
            <circle cx="-18" cy="-58" r="13" fill="#2F7FEA"/>
            <circle cx="22"  cy="-80" r="12" fill="#6FD36F"/>
            <circle cx="60"  cy="-50" r="14" fill="#2F7FEA"/>
            <circle cx="96"  cy="-22" r="13" fill="#6FD36F"/>
            <circle cx="-96" cy="12"  r="13" fill="#FFCC29"/>
            <circle cx="-55" cy="-8"  r="12" fill="#2F7FEA"/>
            <circle cx="-10" cy="-18" r="14" fill="#FFCC29"/>
            <circle cx="36"  cy="-12" r="13" fill="#2F7FEA"/>
            <circle cx="82"  cy="22"  r="14" fill="#FFCC29"/>
            <circle cx="-80" cy="58"  r="13" fill="#FFCC29"/>
            <circle cx="-42" cy="40"  r="13" fill="#2F7FEA"/>
            <circle cx="2"   cy="32"  r="12" fill="#6FD36F"/>
            <circle cx="42"  cy="48"  r="14" fill="#FFCC29"/>
            <circle cx="78"  cy="70"  r="13" fill="#6FD36F"/>
            <circle cx="-28" cy="80"  r="13" fill="#6FD36F"/>
            <circle cx="20"  cy="86"  r="12" fill="#2F7FEA"/>
          </g>
          <g id="arrow" fill="none" stroke="#000" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
            <path d="M-22 -8 H14 M-22 8 H14 M4 -22 L22 0 L4 22"/>
          </g>
        </defs>

        <use href="#cloud" x="125" y="125"/>
        <use href="#arrow" x="285" y="125"/>

        <use href="#cloud" x="450" y="125"/>
        <g transform="translate(450 125)" fill="none" stroke-linejoin="round" stroke-linecap="round" stroke-width="4">
          <ellipse cx="8" cy="0" rx="72" ry="96" transform="rotate(-18 8 0)" stroke="#555"/>

        <path transform="translate(775 125)" fill="none" stroke="#000" stroke-width="4" stroke-linejoin="round"
              d="M-92 -12 L-62 -22 L-44 -62 L16 -98 L-20 -40 L-8 -8 L30 -46 C60 -58 96 -40 98 -6 C100 34 80 70 50 72 C22 74 4 48 -8 22 L-30 70 L-72 62 L-94 30 L-70 8 Z"/>

      <p class="outro">I take analytical and creative stories, take them apart, and put them together for others to understand.<span class="pointer" aria-hidden="true"></span></p>
